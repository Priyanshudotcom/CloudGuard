server.port=8080
spring.application.name=cloudguard-backend

# AWS credentials - override via environment variables in production.
# Never commit real keys to source control.
aws.accessKey={AWS_ACCESS_KEY}
aws.secretKey={AWS_SECRET_KEY}
aws.region=eu-north-1

logging.level.com.cloudguard=INFO
logging.level.software.amazon.awssdk=WARN

# Embedded H2 - audit/history store for terminated instances.
# In-memory + DB_CLOSE_DELAY=-1 so it survives for the app's lifetime
# instead of resetting on the first connection close.
spring.datasource.url=jdbc:h2:mem:cloudguard;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
